name: FunnelCraft-COD Production Deployment

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Owner email that triggered the Sandbox deployment'
        required: true
        type: string
      commit_sha:
        description: 'Verified commit SHA from Sandbox pre-deploy gate'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment-main
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify Gate & Deploy Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run mandatory unit & security test suite
        run: npm test
        env:
          NODE_ENV: test

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Production Server
        if: success()
        env:
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          echo "Deploying verified commit ${{ inputs.commit_sha }} triggered by owner..."
          echo "Production build verified and ready for rollout."
