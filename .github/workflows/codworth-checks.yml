name: CodWorth security and build checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify checked-in lockfile is consistent
        run: npm ci --ignore-scripts --legacy-peer-deps

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies for code validation
        run: npm ci --include=dev --legacy-peer-deps
      - name: Type-check
        run: npm run lint
      - name: Run isolated tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify private backup and read-only archive check
        run: |
          CODWORTH_BACKUP_DIR="$RUNNER_TEMP/codworth-backup-fixture" bash scripts/backup-data.sh
          BACKUP_FILE="$(find "$RUNNER_TEMP/codworth-backup-fixture" -type f -name '*.tar.gz' -print -quit)"
          test -n "$BACKUP_FILE"
          node scripts/verify-backup.mjs "$BACKUP_FILE"
