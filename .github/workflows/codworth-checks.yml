name: CodWorth security and build checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify checked-in lockfile is consistent
        run: npm ci --ignore-scripts --legacy-peer-deps

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies for independent code validation
        run: npm install --include=dev --legacy-peer-deps
      - name: Export generated lockfile for review
        run: |
          echo 'CODWORTH_LOCK_BEGIN'
          base64 -w0 package-lock.json | fold -w 700
          echo 'CODWORTH_LOCK_END'
      - name: Type-check
        run: npm run lint
      - name: Run isolated tests
        run: npm test
      - name: Production build
        run: npm run build
