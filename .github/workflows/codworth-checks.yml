name: CodWorth security and build checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify checked-in lockfile is consistent
        run: npm ci --ignore-scripts --legacy-peer-deps

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies for code validation
        run: npm ci --include=dev --legacy-peer-deps
      - name: Type-check
        run: npm run lint
      - name: Run isolated tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify encrypted backup and read-only archive check
        run: |
          export GNUPGHOME="$RUNNER_TEMP/codworth-gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'CodWorth Backup CI <codworth-backup-ci@example.test>' rsa3072 encr 1d
          CODWORTH_BACKUP_DIR="$RUNNER_TEMP/codworth-backup-fixture" BACKUP_GPG_RECIPIENT="codworth-backup-ci@example.test" bash scripts/backup-data.sh
          BACKUP_FILE="$(find "$RUNNER_TEMP/codworth-backup-fixture" -type f -name '*.tar.gz.gpg' -print -quit)"
          test -n "$BACKUP_FILE"
          (cd "$(dirname "$BACKUP_FILE")" && sha256sum -c "$(basename "$BACKUP_FILE").sha256")
          gpg --batch --yes --decrypt --output "$RUNNER_TEMP/codworth-data.tar.gz" "$BACKUP_FILE"
          node scripts/verify-backup.mjs "$RUNNER_TEMP/codworth-data.tar.gz"
          bash scripts/restore-data.sh "$BACKUP_FILE" "$RUNNER_TEMP/codworth-restore/data"
          test -f "$RUNNER_TEMP/codworth-restore/data/disposable_email_domains.json"
          if bash scripts/restore-data.sh "$BACKUP_FILE" "$RUNNER_TEMP/codworth-restore/data"; then
            echo "Restore unexpectedly overwrote an existing target."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/codworth-malicious/data"
          ln -s /etc/passwd "$RUNNER_TEMP/codworth-malicious/data/escape.json"
          tar -czf "$RUNNER_TEMP/codworth-malicious.tar.gz" -C "$RUNNER_TEMP/codworth-malicious" data
          if node scripts/verify-backup.mjs "$RUNNER_TEMP/codworth-malicious.tar.gz"; then
            echo "Verifier unexpectedly accepted a symlink archive."
            exit 1
          fi
      - name: Verify deployment scripts and PM2 preflight
        run: |
          bash -n deploy.sh scripts/backup-data.sh scripts/restore-data.sh
          node --check scripts/verify-backup.mjs
          node --check scripts/check-pm2-config.mjs
          CODWORTH_PM2_JLIST_JSON='[{"name":"funnelcraft-api","pm2_env":{"status":"online","exec_mode":"fork_mode","instances":1,"watch":false}}]' node scripts/check-pm2-config.mjs
          if CODWORTH_PM2_JLIST_JSON='[{"name":"funnelcraft-api","pm2_env":{"status":"online","exec_mode":"cluster_mode","instances":2,"watch":false}}]' node scripts/check-pm2-config.mjs; then
            echo "PM2 preflight unexpectedly accepted a multi-process configuration."
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
